name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Mínimo privilegio: el token de la CI solo puede leer el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Las Actions de terceros se fijan por SHA de commit (un tag puede moverse; un SHA no).
# Dependabot las mantiene actualizadas. Comentario = versión legible.

jobs:
  calidad:
    name: Lint, formato, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build

  base-de-datos:
    name: Migraciones y tests de RLS (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/db-test.sh

  e2e:
    name: E2E de seguridad (cabeceras, CSP, XSS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Valor público (la URL viaja al navegador); necesario para construir la CSP.
      NEXT_PUBLIC_SUPABASE_URL: https://inzyvqffesgjhvdrgdgg.supabase.co
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

  seguridad:
    name: Secretos y dependencias vulnerables
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # todo el historial: un secreto borrado sigue en los commits antiguos
          persist-credentials: false
      - name: Escaneo de secretos (gitleaks, binario verificado por checksum)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archivo"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archivo}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$archivo" gitleaks
          ./gitleaks git . --redact --verbose --no-banner --exit-code 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Auditoría de dependencias de producción (bloquea altas y críticas)
        run: pnpm audit --prod --audit-level=high

  imagen:
    name: Imagen Docker de producción
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construir la imagen
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://inzyvqffesgjhvdrgdgg.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci \
            -t menus-semanales:ci .
      - name: Comprobar que arranca, responde y no se ejecuta como root
        run: |
          docker run -d --name app -p 3000:3000 menus-semanales:ci
          for i in $(seq 1 30); do curl -sf localhost:3000/api/salud && break; sleep 1; done
          curl -sf localhost:3000/api/salud | grep -q '"estado":"ok"'
          test "$(docker exec app id -u)" != "0"
          ! docker exec app sh -c 'touch /app/server.js' 2>/dev/null
          docker rm -f app
