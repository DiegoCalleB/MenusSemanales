<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        font:
          15px system-ui,
          sans-serif;
        margin: 12px;
        color: #2a1a20;
      }
      textarea {
        width: 100%;
        height: 70px;
        box-sizing: border-box;
      }
      button {
        font: inherit;
        padding: 8px 12px;
        margin: 4px 4px 0 0;
        border-radius: 10px;
        border: 1px solid #c9b;
        cursor: pointer;
      }
      #empezar {
        background: #e0456b;
        color: #fff;
        border-color: #e0456b;
      }
      p {
        margin: 8px 0;
      }
      #estado {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <p><strong>Llenar la cesta de Mercadona</strong></p>
    <p>En ¡Hecho! toca «Copiar el pedido para la extensión» y pégalo aquí.</p>
    <textarea id="pedido" aria-label="Pedido copiado de ¡Hecho!"></textarea>
    <div>
      <button id="pegar" type="button">Pegar</button>
      <button id="empezar" type="button">Empezar</button>
      <button id="parar" type="button">Parar</button>
    </div>
    <p id="estado" role="status"></p>
    <script src="comun.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
